<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PathFinder — Career Copilot for SRM Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5EF; --surface:#FFFFFF; --ink:#10221E; --muted:#54655D; --line:#D8E0D6; --soft:#E7EEE8;
  --brand:#0B6E78; --brand-ink:#FFFFFF; --blaze:#F2B233; --high:#BE3A2B; --med:#94590A; --low:#287748;
  --a-today:#E8A317; --a-find:#0B6E78; --a-practice:#5B54D6; --a-track:#D2603A;
  --side:#0C201C; --side-ink:#CFDBD4; --side-mute:#8AA096;
  --s-today:#F2B233; --s-find:#5CCBD3; --s-practice:#A9A4F8; --s-track:#F29A78;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#091311;--surface:#12211D;--ink:#E9F1EC;--muted:#A3B6AD;--line:#25403A;--soft:#1A2E28;--brand:#54C6CE;--brand-ink:#08201F;--high:#F0796A;--med:#E5B04E;--low:#5FBF86;--side:#07100E;--a-today:#F2B233;--a-find:#54C6CE;--a-practice:#A9A4F8;--a-track:#F29A78;}
}
:root[data-theme="dark"]{--bg:#091311;--surface:#12211D;--ink:#E9F1EC;--muted:#A3B6AD;--line:#25403A;--soft:#1A2E28;--brand:#54C6CE;--brand-ink:#08201F;--high:#F0796A;--med:#E5B04E;--low:#5FBF86;--side:#07100E;--a-today:#F2B233;--a-find:#54C6CE;--a-practice:#A9A4F8;--a-track:#F29A78;}
html{font-size:100%}
html[data-text="lg"]{font-size:112.5%}
html[data-text="xl"]{font-size:125%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.2}
h1{font-size:1.875rem} h2{font-size:1.375rem} h3{font-size:1.125rem} h4{font-size:1.0rem}
p{margin:0 0 8px}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none}
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px 14px;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--blaze);color:#13231F;display:grid;place-items:center;flex:none}
.logo .mark .ic{width:22px;height:22px}
.logo b{font:700 1.25rem var(--display);color:#fff;letter-spacing:-.02em;display:block;line-height:1.1}
.logo small{display:block;font:400 0.75rem/1.3 var(--body);color:var(--side-mute)}
.grp{font-size:0.75rem;color:var(--side-mute);padding:16px 10px 4px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--side-ink);font-size:0.9375rem;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:rgba(240,180,41,.16);color:#fff;font-weight:600}
.nav button.on .ic{color:var(--blaze)}
.nav button:focus-visible{outline:2px solid var(--blaze)}
.side .foot{margin-top:auto;padding-top:16px}
.me{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:9px;border-radius:11px;background:rgba(255,255,255,.06)}
.me:hover{background:rgba(255,255,255,.1)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:600 0.9375rem var(--display);flex:none}
.me b{display:block;color:#fff;font-size:0.875rem;line-height:1.2}
.me span{font-size:0.75rem;color:var(--side-mute)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px 0;font-size:0.8125rem}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--side-mute)}
.tools button{all:unset;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--side-ink);display:flex}
.tools button:hover{background:rgba(255,255,255,.1)}
.main{overflow-y:auto;padding:30px 40px 100px}
.wrap{max-width:1120px;margin:0 auto}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:0.875rem;color:var(--muted);margin-bottom:18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card+.card{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2>.card,.grid3>.card{margin-top:0}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:0.875rem} .tiny{font-size:0.8125rem}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:0.8125rem;color:var(--ink);border:1px solid var(--line);line-height:1.35}
.chip.ok{background:color-mix(in srgb,var(--low) 16%,transparent);border-color:color-mix(in srgb,var(--low) 45%,transparent)}
.chip.no{background:color-mix(in srgb,var(--high) 13%,transparent);border-color:color-mix(in srgb,var(--high) 45%,transparent)}
.chip.warn{background:color-mix(in srgb,var(--med) 16%,transparent);border-color:color-mix(in srgb,var(--med) 45%,transparent)}
.chip.big{font-size:0.875rem;font-weight:600;padding:5px 13px}
.chip.src-official{background:color-mix(in srgb,var(--brand) 14%,transparent);border-color:var(--brand)}
.chip.src-alumni{background:color-mix(in srgb,var(--blaze) 24%,transparent);border-color:var(--blaze)}
.badge{display:inline-block;font-size:0.8125rem;font-weight:600;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.badge.high{background:color-mix(in srgb,var(--high) 15%,transparent);color:var(--high)}
.badge.med{background:color-mix(in srgb,var(--med) 16%,transparent);color:var(--med)}
.badge.low{background:color-mix(in srgb,var(--low) 16%,transparent);color:var(--low)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;min-height:40px;font-weight:500;font-size:0.9375rem;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 13px;min-height:34px;font-size:0.875rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=email],input[type=url],select,textarea{width:100%;padding:9px 12px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);width:18px;height:18px}
label.f{display:block;font-size:0.875rem;font-weight:500;color:var(--muted);margin-bottom:12px}
label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px;color:var(--ink);font-weight:400}
.frm{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.frm .full{grid-column:1/-1}
.filters{display:grid;grid-template-columns:2fr 1fr 1.3fr 1fr;gap:0 12px;align-items:end}
.filters label.f{margin-bottom:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 16px;color:var(--muted);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap;font-size:0.9375rem}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--brand)}
.bar{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:0.875rem;margin:8px 0}
.bar i{display:block;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s}
.bar.low i b{background:var(--high)} .bar.mid i b{background:var(--med)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.pri{border-left:5px solid var(--line)}
.pri.high{border-left-color:var(--high)} .pri.med{border-left-color:var(--med)} .pri.low{border-left-color:var(--low)}
.pri h3{font-size:1.125rem}
.feat{box-shadow:0 10px 28px -16px rgba(19,35,31,.4);background:linear-gradient(0deg,var(--surface),var(--surface))}
.feat h3{font-size:1.375rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.high{background:var(--high)}.dot.med{background:var(--med)}.dot.low{background:var(--low)}
table{width:100%;border-collapse:collapse;font-size:0.9375rem}
th{text-align:left;font-weight:600;font-size:0.875rem;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--blaze) 20%,transparent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:2.125rem;font-weight:700;line-height:1}
.trail{width:100%;height:auto;display:block}
.trail text{font:500 0.75rem var(--body);fill:var(--muted)}
.trail text.now{fill:var(--ink);font-weight:600}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px dashed var(--line)}
.timeline li{position:relative;padding:0 0 15px 14px}
.timeline li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.timeline li.done::before{background:var(--brand)}
.timeline li.cur::before{background:var(--blaze);border-color:var(--blaze)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{min-height:60px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:0.8125rem;background:var(--surface)}
.cal .hd{min-height:0;border:0;background:none;color:var(--muted);text-align:center}
.cal .today{border-color:var(--blaze);border-width:2px}
.cal .ev{display:block;margin-top:2px;padding:0 4px;border-radius:4px;background:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:0.75rem}
.cal .ev.sv{background:var(--blaze);color:#13231F}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:0.9375rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw}
.toast.show{opacity:1}
.scroll-x{overflow-x:auto}
details summary{cursor:pointer;color:var(--brand);font-size:0.875rem;font-weight:500;padding:4px 0}
details[open] summary{margin-bottom:4px}
.chat{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.msg{padding:11px 15px;border-radius:16px;max-width:88%;white-space:pre-wrap}
.msg.ai{background:var(--soft);align-self:flex-start;border-bottom-left-radius:5px}
.msg.me{background:var(--brand);color:var(--brand-ink);align-self:flex-end;border-bottom-right-radius:5px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hero-q{font-size:2.25rem;max-width:20ch}
.hello{color:var(--muted);font-size:0.9375rem;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:8px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft)}
.opt input{margin-right:4px;flex:none}
.opt.right{border-color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent)}
.opt.wrong{border-color:var(--high);background:color-mix(in srgb,var(--high) 12%,transparent)}
.diff{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:0.875rem;white-space:normal}
.diff ul{margin:4px 0 8px 16px;padding:0}
.diff li{margin:3px 0}
.qr{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qr .btn.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 22px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s,transform .1s}
.tile:hover{border-color:var(--brand)}
.tile:focus-visible{outline:2px solid var(--brand)}
.tile .big{font-size:1.75rem}
.ring{width:60px;height:60px;flex:none}
.ring .rt{font:700 1.125rem var(--display);fill:var(--ink)}
.opp h3{font-size:1.125rem}
.opp .fit{text-align:center;min-width:54px}
.opp .fit b{display:block;font:700 1.375rem var(--display);color:var(--brand);line-height:1}
.rules{margin:10px 0}
.foot2{margin-top:12px}
.empty{text-align:center;padding:34px 20px}
.empty .ic{width:38px;height:38px;color:var(--muted);margin-bottom:8px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;flex:1;min-width:120px;padding:9px 12px;border-radius:11px;background:var(--soft);color:var(--muted);font-size:0.875rem;font-weight:500}
.steps li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:0.8125rem;flex:none}
.steps li.cur{background:var(--brand);color:var(--brand-ink)}
.steps li.cur b{background:var(--blaze);color:#13231F;border-color:var(--blaze)}
.steps li.done{color:var(--ink)}
.steps li.done b{background:var(--low);color:#fff;border-color:var(--low)}
.fab{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:12;border:0;cursor:pointer;background:var(--ink);color:var(--bg);border-radius:99px;padding:12px 18px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:0.9375rem;box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
.fab:hover{filter:brightness(1.15)}
.fab .ic{color:var(--blaze)}
.mtop,.tabbar{display:none}
#sheet .ov{position:fixed;inset:0;background:rgba(10,20,17,.5);z-index:30;display:flex;align-items:flex-end}
#sheet .sb{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto}
#sheet .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
#sheet .g3 button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--soft);font-size:0.8125rem;text-align:center}
#sheet .g3 button.on{background:var(--brand);color:var(--brand-ink)}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--side);color:#fff}
  .mtop .logo{padding:0}.mtop .logo .mark{width:30px;height:30px;border-radius:9px}.mtop .logo small{display:none}.mtop .logo b{font-size:1.125rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:0.75rem;color:var(--muted)}
  .tabbar button.on{color:var(--brand);font-weight:600}
  .tabbar button:focus-visible{outline:2px solid var(--brand)}
  body.onb .tabbar,body.onb .fab{display:none}
  .fab{right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:11px 15px}
  .main{padding:18px 16px 130px}
  .split,.grid2,.grid3,.frm,.filters{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .hero-q{font-size:1.75rem}
  h1{font-size:1.625rem}
  .bar{grid-template-columns:96px 1fr 42px}
  .steps li{min-width:0;flex:1 1 45%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v3: chrome, accents, motion, a11y ===== */
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--blaze);color:#13231F;padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{left:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1:focus,.main:focus{outline:none}
.app{grid-template-rows:auto minmax(0,1fr)}
.side,.main{min-height:0}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--side);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:20}
.topbar .logo{padding:0;min-width:226px}
.tsearch{all:unset;box-sizing:border-box;flex:1;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--side-ink);cursor:pointer;border:1px solid rgba(255,255,255,.12);font-size:.95rem;transition:background .15s,border-color .15s}
.tsearch:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25)}
.tsearch:focus-visible{outline:2px solid var(--blaze)}
.tsearch kbd{margin-left:auto}
kbd{font:600 .75rem var(--body);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:inherit}
.tacts{display:flex;align-items:center;gap:4px;margin-left:auto}
.tchip{font-size:.8rem;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--side-ink);margin-right:6px;white-space:nowrap}
.ib{all:unset;box-sizing:border-box;position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--side-ink);transition:background .15s}
.ib:hover,.ib[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.ib:focus-visible{outline:2px solid var(--blaze)}
.ib .cnt{position:absolute;top:3px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--blaze);color:#13231F;font:700 .7rem/18px var(--body);text-align:center;padding:0 4px}
.ib .av{width:32px;height:32px}
.side{padding-top:14px}

    if(!S.resume.score&&S.prep.resume!=='ready') L.push({lvl:'high',title:'Run the resume ATS analyzer',why:'Most placement drives shortlist on resume first.',dl:null,effort:'20 minutes',goal:'Fixes formatting and keyword gaps before applications.',res:['ATS analyzer'],act:['Analyze resume','resume']});

const hostedAvailable = () => !!(window.claude && window.claude.use);
function aiMode(){ const p=(S.ai&&S.ai.provider)||'auto'; if(p==='off') return 'off'; if(p==='ollama') return 'ollama'; return hostedAvailable()?'hosted':'ollama'; }
function aiLabel(){ const m=aiMode(); return m==='off'?'off (rule-based)':m==='hosted'?'built-in assistant':'local · '+S.ai.model; }

const cleanThink = t => String(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<think>[\s\S]*$/,'').trim();
function extractJson(t){
  t=cleanThink(t).replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(t); }catch(e){ const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) return JSON.parse(t.slice(a,b+1)); throw e; }
}
async function ollamaUp(force){
  const now=Date.now(); if(!force&&U.ai.checked&&now-U.ai.checked<15000) return U.ai.ok;
  try{ const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),2500); const r=await fetch(S.ai.url.replace(/\/+$/,'')+'/api/tags',{signal:ctl.signal}); clearTimeout(to); const j=await r.json(); U.ai.models=(j.models||[]).map(x=>x.name); U.ai.ok=r.ok; }
  catch(e){ U.ai.ok=false; }
  U.ai.checked=now; return U.ai.ok;
}
function aiFriendly(e){
  const m=String(e&&e.message||e);
  if(e&&(e.name==='TypeError'||e.name==='AbortError')) return `cannot reach Ollama at ${S.ai.url}. Is it running?`;
  if(/not found/i.test(m)) return `model "${S.ai.model}" is not installed. Run: ollama pull ${S.ai.model}`;
  return m;
}
async function ollamaChat(messages,{json=false,maxTokens=700,temperature=0.6}={}){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),180000);
  try{
    const res=await fetch(S.ai.url.replace(/\/+$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify(Object.assign({model:S.ai.model,messages,stream:false,think:false,options:{temperature,num_predict:maxTokens}},json?{format:'json'}:{}))});
    if(!res.ok){ let d=''; try{ d=(await res.json()).error||''; }catch(e){} throw new Error(d||('HTTP '+res.status)); }
    const j=await res.json(); return cleanThink((j.message&&j.message.content)||'');
  } finally { clearTimeout(to); }
}
function makeLocalSample(){
  const toMsgs=input=>Array.isArray(input)?input.map(m=>({role:m.role,content:m.content})):[{role:'user',content:String(input)}];
  const fail=e=>{ U.ai.err=aiFriendly(e); if(Date.now()-(U.ai.lastToast||0)>6000){ U.ai.lastToast=Date.now(); toast('Local AI: '+U.ai.err); } if(e&&e.name==='TypeError') U.ai.checked=0; throw e; };
  const f=async(input,opts={})=>{ try{ return {text:await ollamaChat(toMsgs(input),{maxTokens:opts.maxTokens||600})}; }catch(e){ return fail(e); } };
  f.json=async(input,opts={})=>{ try{ return extractJson(await ollamaChat(toMsgs(input),{json:true,maxTokens:opts.maxTokens||900,temperature:.3})); }catch(e){ return fail(e); } };
  return f;
}
async function getSample(){
  const m=aiMode(); if(m==='off') return null;
  if(m==='hosted'){ try{ return await window.claude.use('sample'); }catch(e){ return null; } }
  if(!(await ollamaUp())){ if(Date.now()-(U.ai.lastToast||0)>6000){ U.ai.lastToast=Date.now(); toast('Local AI not reachable, using the built-in rule-based fallback'); } return null; }
  return makeLocalSample();
}

}

const readBuf = f => f.arrayBuffer ? f.arrayBuffer() : new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsArrayBuffer(f); });
const readText = f => f.text ? f.text() : new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsText(f); });
function loadScript(srcs){
  return new Promise((res,rej)=>{ let i=0; const next=()=>{ if(i>=srcs.length) return rej(new Error('Could not load the PDF/Word reader (no network?)')); const s=document.createElement('script'); s.src=srcs[i++]; s.onload=()=>res(s.src); s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); }; next(); });
}
async function ensurePdfJs(){
  if(window.pdfjsLib) return;
  const src=await loadScript(['vendor/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js']);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=src.slice(0,src.lastIndexOf('/')+1)+'pdf.worker.min.js';
}
async function ensureMammoth(){ if(window.mammoth) return; await loadScript(['vendor/mammoth.browser.min.js','https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js']); }
function pdfPagesToText(pages){
  const out=[]; let rowsTotal=0, wide=0;
  pages.forEach(items=>{
    const its=items.filter(it=>it&&typeof it.str==='string'&&it.str.length).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.height||it.transform[3]||10)}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[]; its.forEach(it=>{ const r=rows[rows.length-1]; if(r&&Math.abs(r.y-it.y)<=Math.max(2,Math.min(r.h,it.h)*.45)) r.items.push(it); else rows.push({y:it.y,h:it.h,items:[it]}); });
    let prevY=null, prevH=null;
    rows.forEach(r=>{
      r.items.sort((a,b)=>a.x-b.x); let line='', end=null, big=false;
      r.items.forEach(it=>{ if(end!=null){ const gap=it.x-end; if(gap>r.h*6){ line+='   '; big=true; } else if(gap>r.h*.18) line+=' '; } line+=it.s; end=it.x+it.w; });
      line=line.replace(/^[\s]*[\uE000-\uF8FF•●▪◦‣■➢➤►·]\s*/,'• ').replace(/^\s*[–—]\s+/,'• ').replace(/[ \t]+$/,'');
      if(!line.trim()) return; rowsTotal++; if(big) wide++;
      if(prevY!=null&&prevY-r.y>Math.max(prevH,r.h)*1.9) out.push('');
      out.push(line); prevY=r.y; prevH=r.h;
    });
    out.push('');
  });
  return {text:out.join('\n'),colFlag:rowsTotal>0&&wide/rowsTotal>.3};
}
function mergeWrapped(text){
  const L=text.split('\n'), o=[];
  L.forEach(l=>{ const p=o[o.length-1]; const t=l.trim(); if(t&&p&&/^[•\-*]\s/.test(p)&&!/^[•\-*]\s/.test(t)&&!headKey(t)&&p.length>=60&&/^[a-z(0-9]/.test(t)) o[o.length-1]=p+' '+t; else o.push(l); });
  return o.join('\n');
}
function cleanResumeText(t){
  return t.replace(/\r/g,'').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/^[ \t]*[●▪◦‣■➢➤►]\s*/gm,'• ').replace(/\n{3,}/g,'\n\n').trim();
}
async function docxToText(buf){
  await ensureMammoth(); const r=await window.mammoth.convertToHtml({arrayBuffer:buf}); const doc=new DOMParser().parseFromString(r.value,'text/html'); const out=[];
  doc.body.childNodes.forEach(n=>{
    const tag=(n.nodeName||'').toLowerCase(), tx=(n.textContent||'').trim();
    if(/^h[1-6]$/.test(tag)){ out.push('',tx); }
    else if(tag==='ul'||tag==='ol'){ n.querySelectorAll('li').forEach(li=>out.push('• '+li.textContent.trim())); }
    else if(tag==='table'){ n.querySelectorAll('tr').forEach(tr=>out.push([...tr.children].map(c=>c.textContent.trim()).filter(Boolean).join(' | '))); }
    else if(tx) out.push(tx);
  });
  return out.join('\n');
}
async function handleResumeFile(file){
  if(!file) return;
  if(file.size>8*1024*1024){ U.resumeErr='That file is larger than 8 MB.'; render(); return; }
  const name=file.name, ext=(name.split('.').pop()||'').toLowerCase();
  U.resumeBusy='Reading '+name+'…'; U.resumeErr=''; render();
  try{
    let text='', pages=null, col=false;
    if(ext==='pdf'||file.type==='application/pdf'){
      await ensurePdfJs(); const buf=await readBuf(file);
      const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise; pages=pdf.numPages; const all=[];
      for(let i=1;i<=Math.min(pdf.numPages,6);i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); all.push(tc.items); }
      const r=pdfPagesToText(all); text=mergeWrapped(r.text); col=r.colFlag;
    } else if(ext==='docx'){ text=await docxToText(await readBuf(file)); }
    else if(ext==='doc'){ throw new Error('Old .doc files cannot be read. Save it as .docx or PDF and upload again.'); }
    else { text=await readText(file); }
    text=cleanResumeText(text);
    if(text.replace(/\s/g,'').length<150) throw new Error('This file has almost no readable text. If it is a scanned image, export a text-based PDF from Word or Google Docs, or paste the text.');
    S.resume.text=text; S.resume.file={name,type:ext,pages,chars:text.length,col};
    U.resumeBusy=''; U.tab.resume='summary'; analyzeResume(); render();
    toast(`Read ${name}: ${text.length} characters. Score ${S.resume.score}. Check the extracted text below.`);
  }catch(e){ U.resumeBusy=''; U.resumeErr='Could not read this file: '+(e&&e.message||e); render(); }
}

function radarSvg(cats){
  const cx=170, cy=158, R0=100; const pt=(i,v)=>{ const a=-Math.PI/2+i*2*Math.PI/6; return [+(cx+Math.cos(a)*R0*v/100).toFixed(1),+(cy+Math.sin(a)*R0*v/100).toFixed(1)]; };
  const rings=[25,50,75,100].map(v=>`<polygon points="${SIX.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const axes=SIX.map((_,i)=>{ const p=pt(i,100); return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line)"/>`; }).join('');
  const poly=SIX.map((k,i)=>pt(i,cats[k]==null?0:cats[k]).join(',')).join(' ');
  const dots=SIX.map((k,i)=>{ if(cats[k]==null) return ''; const p=pt(i,cats[k]); return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--brand)"/>`; }).join('');
  const labels=SIX.map((k,i)=>{ const p=pt(i,125), anchor=p[0]<cx-10?'end':p[0]>cx+10?'start':'middle'; return `<text x="${p[0]}" y="${p[1]+4}" text-anchor="${anchor}" style="font:600 11px var(--body);fill:var(--muted)">${SIX_SHORT[k]}${cats[k]==null?' (n/a)':' '+cats[k]}</text>`; }).join('');
  return `<svg viewBox="0 0 340 316" class="radar" role="img" aria-label="Radar chart: ${SIX.map(k=>k+' '+(cats[k]==null?'not asked':cats[k])).join(', ')}">${rings}${axes}<polygon points="${poly}" fill="var(--brand)" fill-opacity=".22" stroke="var(--brand)" stroke-width="2"/>${dots}${labels}</svg>`;
}

function similarity(a){
  const p=P(), why=[]; let s=0;
  if(a.branch===p.branch){s+=25;why.push('same branch');}
  const tr=p.roles.includes(a.target); if(tr){s+=30;why.push('same target role');}
  const io=a.interests.filter(i=>p.interests.includes(i)); if(io.length){s+=Math.min(30,io.length*15);why.push(io.length+' shared interest'+(io.length>1?'s':''));}
  const cd=Math.abs(a.cgpa-p.cgpa); s+=Math.max(0,15-cd*10); if(cd<=0.5) why.push('CGPA within 0.5');
  return {s:Math.round(clamp(s)),why};
}

  const cards=[
   `<div class="card"><h3>Academic</h3><div class="frm" style="margin-top:12px">${t('profile.name','Name',p.name)}${t('profile.email','SRM email',p.email,'email')}

   ${t('profile.cgpa','CGPA',p.cgpa,'number')}${t('profile.backlogs','Active arrears / backlogs',p.backlogs,'number')}${t('profile.sems','Semester-wise CGPA (comma separated)',p.sems,'text','full')}</div></div>`,
   `<div class="card"><h3>Technical skills</h3><div class="frm" style="margin-top:12px">${t('profile.langs','Programming languages',p.langs)}${t('profile.frameworks','Frameworks',p.frameworks)}${t('profile.aiml','AI/ML skills',p.aiml)}${t('profile.web','Web development',p.web)}${t('profile.db','Databases',p.db)}${t('profile.cloud','Cloud',p.cloud)}
   <label class="f">DSA level<select data-bind="profile.dsa">${['Beginner','Intermediate','Advanced'].map(x=>`<option ${p.dsa===x?'selected':''}>${x}</option>`).join('')}</select></label>${t('profile.other','Other',p.other)}</div></div>

function roadPlan(){
  const c=roadCtx(), pr=roadPrefs(); const spec=ROAD_SPEC[c.y]||ROAD_SPEC[3]; const ov=OVERLAY[pr.goal]||null;
  const oi=oppTasks(c), inj=((c.y>=3&&!['research','masters','gsoc','startup'].includes(pr.goal))||pr.goal==='placement')?coTasks(c):{};
  const raw=[]; const seen=new Set();
  for(let i=0;i<12;i++){
    const list=[]; const add=t=>{ if(t&&!seen.has(t.id)){ seen.add(t.id); list.push(t); } };
    [...(oi[i]||[]),...(inj[i]||[])].slice(0,3).forEach(add);
    [...(ov?ov[i]:[]),...spec[i]].forEach(s=>add(slotTask(s,c,i)));
    raw.push(list);
  }
  // moves, hides, custom
  const byId={}; raw.forEach((l,i)=>l.forEach(t=>byId[t.id]=i));
  Object.entries(pr.moved).forEach(([id,to])=>{ const from=byId[id]; if(from==null) return; const idx=raw[from].findIndex(t=>t.id===id); const [t]=raw[from].splice(idx,1); t.moved=true; raw[Math.max(0,Math.min(11,+to))].unshift(t); });
  const weeks=[];
  for(let i=0;i<12;i++){
    let tasks=raw[i].filter(t=>!pr.hidden[t.id]).map(t=>{ t.w=t.w*(TRACKS.some(x=>x[0]===t.tag)?roadTrackW(t.tag):1); return t; }).filter(t=>t.w>0);
    const cust=pr.custom.filter(x=>+x.week===i).map(x=>tk(x.id,x.tag||'Project',x.title,1,{why:'Added by you.',steps:(x.steps||[]).filter(Boolean),done:'You marked it done.',links:x.link?[{label:'Open your link',url:x.link}]:[],custom:true,fixedH:+x.h||1}));
    const light=!!pr.light[i]; tasks=tasks.slice(0,light?3:Math.max(1,6-cust.length));
    const budget=Math.max(1,c.hrs*(light?.5:1)-sumA(cust.map(t=>t.fixedH))); const sw=tasks.reduce((x,t)=>x+t.w,0)||1;
    tasks.forEach(t=>{ t.h=Math.max(.5,Math.round(budget*t.w/sw*2)/2); });
    cust.forEach(t=>{ t.h=t.fixedH; });
    const all=[...cust,...tasks]; all.forEach(t=>{ if(!t.links||!t.links.length) t.links=autoLinks(t.id); });
    weeks.push({i,label:rdLabel(i),phase:Math.floor(i/4),tasks:all,light,tags:[...new Set(all.map(t=>TAGS[t.tag]||t.tag))]});
  }
  return {c,weeks};
}

function alumniMsg(a){

  check:t=>{ S.checklist[t.dataset.key]=t.checked; render(); },
  'match-prof':()=>{ const q=U.prof.q.toLowerCase(); const words=[...new Set(q.match(/[a-z][a-z\-]{2,}/g)||[])].filter(w=>!['and','the','interested','about','into','with','for','love','want','work'].includes(w)); 
    const res=PROFS.map(p=>{ let s=0,hits=[],inPaper=false; words.forEach(w=>{ const inTag=p.tags.some(t=>t.includes(w)); const inP=p.papers.some(x=>x.toLowerCase().includes(w)); if(inTag||inP){ s+=(inTag?3:0)+(inP?2:0); hits.push(w); if(inP) inPaper=true; }}); const max=words.length*5||1; return {p,hits,inPaper,pct:Math.round(clamp(100*s/max))}; }).filter(r=>r.hits.length).sort((a,b)=>b.pct-a.pct).slice(0,5);
    U.prof.res=res; render(); },
  'pick-prof':t=>{ U.email.pid=t.dataset.id; U.tab.research='email'; render(); },
  'gen-email':async()=>{ const pr=PROFS.find(p=>p.id===U.email.pid); if(!pr){toast('Choose a professor first');return;} U.email.busy=true; render(); const work=U.email.work||P().projects.split('\n')[0]||''; const s=await getSample(); let text=null;
    if(s){ try{ const r=await s(`Write a concise, professional cold email (under 180 words) from an SRM University undergraduate to ${pr.name} at ${pr.uni} (${pr.dept}, ${pr.lab}) asking about research internship opportunities. Reference these specific papers by title and connect them to the student's background; do NOT invent any other papers, results or facts. Papers: ${pr.papers.join(' | ')}. Student: ${P().name}, ${P().branch}, year ${P().year}, CGPA ${P().cgpa}. Relevant work: ${work}. Skills: ${skillText().slice(0,200)}. Output the subject line first, then the email body, and end with attaching CV and transcript.`,{cache:false}); text=r.text.trim(); }catch(e){} }
    if(!text) text=`Subject: Research internship enquiry — ${pr.papers[0].split(' ').slice(0,6).join(' ')}…\n\nDear ${pr.name},\n\nI am ${P().name}, a year ${P().year} ${P().branch} student at SRMIST (CGPA ${P().cgpa}). I read your group's work on "${pr.papers[0]}" and found the approach to ${pr.tags[0]} especially interesting, and I would like to learn more about "${pr.papers[1]}".\n\nRecently I worked on ${work||'a related project'}, which gave me hands-on experience with ${P().aiml||P().langs}. I would be grateful for the chance to contribute to your lab as a research intern, or to hear whether there are openings.\n\nI have attached my CV and transcript, and my GitHub is ${P().links.github||'[link]'}.\n\nThank you for your time.\n\nSincerely,\n${P().name}\n${P().email}`;
    U.email.text=text; U.email.busy=false; S.emails[pr.id]=true; render(); toast('Email drafted — edit before sending'); },
  'copy-email':async()=>{ const v=document.getElementById('emailText').value; try{ await navigator.clipboard.writeText(v); toast('Copied'); }catch(e){ document.getElementById('emailText').select(); toast('Press Ctrl+C to copy'); } },
  shortlist:t=>{ const a=S.gsoc.short, i=a.indexOf(t.dataset.id); if(i>=0) a.splice(i,1); else if(a.length<3){a.push(t.dataset.id); if(S.gsoc.stage<1) S.gsoc.stage=1;} else toast('Shortlist up to 3 organizations'); render(); },
  'gsoc-next':()=>{ S.gsoc.stage=Math.min(9,S.gsoc.stage+1); render(); toast('Timeline updated'); },
  'gsoc-back':()=>{ S.gsoc.stage=Math.max(0,S.gsoc.stage-1); render(); },
  'start-contest':()=>{ U.contest.started=true; U.contest.t0=Date.now(); S.arena.answers={}; render(); },
  answer:t=>{ S.arena.answers[t.dataset.pid]=parseInt(t.value,10); save(); },
  'submit-contest':()=>{ const A=S.arena.answers; const subs=PROBLEMS.map((p,i)=>({i:i+1,topic:p.topic,ok:A[p.id]===p.a,pts:p.pts})); const score=subs.filter(s=>s.ok).reduce((x,s)=>x+s.pts,0);
    const topics={}; subs.forEach(s=>topics[s.topic]=s.ok?100:0);
    Object.entries(topics).forEach(([t,v])=>{ if(S.prep.notStarted.includes(t)){ S.prep.notStarted=S.prep.notStarted.filter(x=>x!==t); S.lc.topics[t]=v; } else S.lc.topics[t]=Math.round(S.lc.topics[t]*.7+v*.3); });
    const prev=S.contests[S.contests.length-1].rating; const delta=Math.round((score-400)/8); S.contests.push({n:12,score,topics,rating:prev+delta,delta});
    S.arena.submissions=subs; S.arena.done=true; U.contest={started:false,t0:0,result:true}; clearInterval(clockT); render(); toast('Roadmap and readiness updated from your results'); },
  'reset-contest':()=>{ if(S.arena.done){ S.contests.pop(); } S.arena.done=false; S.arena.answers={}; S.arena.submissions=[]; U.contest={started:false,t0:0,result:null}; S.lc.topics={...freshState().lc.topics}; render(); },
  board:t=>{ U.board=t.dataset.v; render(); },
  'show-name':t=>{ S.arena.showName=t.checked; render(); },
  interest:t=>{ S.arena.challengeInterest[t.dataset.key]=t.checked; save(); },
  'open-company':t=>{ U.company=t.dataset.id; render(); document.getElementById('main').scrollTop=0; },
  'close-company':()=>{ U.company=null; render(); },
  'track-company':t=>{ const c=COMPANIES.find(x=>x.id===t.dataset.id); addApp({kind:'company',ref:c.id,name:c.name,role:c.role,deadline:c.dl}); render(); toast('Tracking in Applications'); },
  'submit-contrib':()=>{ const g=id=>document.getElementById(id).value.trim(); if(!g('cbCo')||!g('cbText')){toast('Add a company and your experience');return;} S.contrib.push({co:g('cbCo'),round:g('cbRound'),diff:g('cbDiff'),topics:g('cbTopics'),text:g('cbText')}); render(); toast('Submitted for admin review'); },
};

render();
</script>
